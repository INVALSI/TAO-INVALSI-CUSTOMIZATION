<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Test Runner Plugin - Table Choice Helper</title>
    <link rel="stylesheet" type="text/css" href="/tao/views/js/lib/qunit/qunit.css">
    <link rel="stylesheet" type="text/css" href="/tao/views/css/tao-main-style.css">
    <script type="text/javascript" src="/tao/views/js/lib/require.js"></script>
    <script type="text/javascript" src="/tao/views/js/lib/qunit/qunit.js"></script>
    <script type="text/javascript" src="/tao/views/js/lib/qunit/qunit-parameterize.js"></script>
    <script type="text/javascript" src="/tao/views/js/lib/blanket/blanket.min.js" data-cover-flag="branchTracking" data-cover-only="runner/plugins/tools/formula/plugin.js"></script>

    <script  type="text/javascript">

        //don't start the test now
        QUnit.config.autostart = false;

        //load the config
        require(['/tao/ClientConfig/config'], function(){

            //load the test
            require(['taoInvalsi/test/runner/plugins/content/tableChoiceHelper/plugin/test'], function(){

                //Tests loaded, run tests
                QUnit.start();
            });
        });
    </script>
</head>
<body>
    <div id="qunit"></div>
    <div id="qunit-fixture">
        <!-- The original problem that lead to this plugin was that Invalsi started to use a DOM structure 
            that was different from what we had agreed to for __custom__choice-interaction-table. 
            As a result CSS selectors did no longer work. The unusual nesting below is meant to represent an 
            unpredictable item structure.
        -->
        <div id="item" class="qti-itemBody  __custom__choice-interaction-table">
            <div><div id="ia-1" class="qti-interaction qti-blockInteraction qti-choiceInteraction"></div></div>
            <ul><li><div id="ia-2" class="qti-interaction qti-blockInteraction qti-choiceInteraction"></div></li></ul>
            <div><ul><li><div id="ia-3" class="qti-interaction qti-blockInteraction qti-choiceInteraction"></div></li></ul></div>            
            <div id="ia-4" class="qti-interaction qti-blockInteraction qti-choiceInteraction"></div>
        </div>
    </div>
</body>
</html>
